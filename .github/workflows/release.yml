name: Build installers

# Push a tag like v1.0.0 to build the installers and publish them as a GitHub Release,
# or run it by hand from the Actions tab (the files are then attached to the run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version }}"; fi
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 installer/build_release.sh "$V"

      - name: Attach to the run
        uses: actions/upload-artifact@v4
        with:
          name: StrongholdAssault-installers
          path: dist/*
          compression-level: 0

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: installer/RELEASE_NOTES.md
